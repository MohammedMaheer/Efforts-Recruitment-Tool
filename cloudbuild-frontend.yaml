steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/efforts-recruitment-ai/recruitment-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '--build-arg'
      - 'VITE_API_URL=https://recruitment-backend-656398252824.us-central1.run.app'
      - '--build-arg'
      - 'VITE_ENV=production'
      - '.'
images:
  - 'gcr.io/efforts-recruitment-ai/recruitment-frontend:latest'
options:
  logging: CLOUD_LOGGING_ONLY
