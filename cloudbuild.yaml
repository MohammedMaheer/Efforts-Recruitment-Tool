# Google Cloud Build configuration
# Builds and deploys backend + frontend to Cloud Run
#
# Required substitutions (set in Cloud Build trigger or below):
#   _REGION: GCP region (default: us-central1)
#   _GCS_BUCKET: GCS bucket for recruitment data
#
# Required secrets (create in Secret Manager BEFORE first build):
#   GEMINI_API_KEY          - Google Gemini API key (primary AI)
#   JWT_SECRET_KEY          - JWT signing secret (min 32 chars)
#   OPENAI_API_KEY          - OpenAI fallback (optional but recommended)
#   MICROSOFT_CLIENT_ID     - MS Graph OAuth client ID
#   MICROSOFT_CLIENT_SECRET - MS Graph OAuth client secret
#   MICROSOFT_TENANT_ID     - MS Graph tenant ID

steps:
  # Step 1: Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/recruitment-backend:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/recruitment-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '--build-arg'
      - 'REQUIREMENTS_FILE=requirements.production.txt'
      - './backend'
    id: 'build-backend'

  # Step 2: Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/recruitment-backend:${SHORT_SHA}']
    id: 'push-backend'
    waitFor: ['build-backend']

  # Step 3: Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'recruitment-backend'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/recruitment-backend:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '120'
      - '--max-instances'
      - '2'
      - '--min-instances'
      - '1'
      - '--concurrency'
      - '40'
      - '--no-cpu-throttling'
      - '--cpu-boost'
      - '--port'
      - '8000'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DEBUG=false,HOST=0.0.0.0,PORT=8000,SYNC_INTERVAL_MINUTES=30,MAX_EMAILS_PER_SYNC=500,AI_TIMEOUT=60,AI_ANALYSIS_TIMEOUT=30,GEMINI_MODEL=gemini-2.5-flash,GCS_BUCKET_NAME=${_GCS_BUCKET}'
      - '--update-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,MICROSOFT_CLIENT_ID=MICROSOFT_CLIENT_ID:latest,MICROSOFT_CLIENT_SECRET=MICROSOFT_CLIENT_SECRET:latest,MICROSOFT_TENANT_ID=MICROSOFT_TENANT_ID:latest'
    id: 'deploy-backend'
    waitFor: ['push-backend']

  # Step 4: Discover backend URL from deployed service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run services describe recruitment-backend \
          --region=${_REGION} --format='value(status.url)' > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
    id: 'get-backend-url'
    waitFor: ['deploy-backend']

  # Step 5: Build frontend with discovered backend URL
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$$(cat /workspace/backend_url.txt)
        docker build \
          -t gcr.io/${PROJECT_ID}/recruitment-frontend:${SHORT_SHA} \
          -t gcr.io/${PROJECT_ID}/recruitment-frontend:latest \
          -f Dockerfile.frontend \
          --build-arg VITE_API_URL=$$BACKEND_URL \
          --build-arg VITE_ENV=production \
          .
    id: 'build-frontend'
    waitFor: ['get-backend-url']

  # Step 6: Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${PROJECT_ID}/recruitment-frontend:${SHORT_SHA}']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  # Step 7: Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'recruitment-frontend'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/recruitment-frontend:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '2'
      - '--min-instances'
      - '0'
      - '--port'
      - '3000'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

substitutions:
  _REGION: 'us-central1'
  _GCS_BUCKET: 'efforts-recruitment-data'

images:
  - 'gcr.io/${PROJECT_ID}/recruitment-backend:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/recruitment-backend:latest'
  - 'gcr.io/${PROJECT_ID}/recruitment-frontend:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/recruitment-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_MEDIUM'
